quarkus:
  otel:
    enabled: false
    exporter:
      otlp:
        endpoint: "http://example:4317"
  mongodb:
    devservices:
      image-name: mongo:8.0.5
      port: 27017
    database: reality
  # tests never call the real geocoder or places service
  rest-client:
    "nominatim-api":
      url: "http://localhost:1"
    "overpass-api":
      url: "http://localhost:1"

reality:
  scheduler:
    places-cron: "off"
